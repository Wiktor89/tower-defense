<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заполни пропуски</title>
</head>
<body>
  <div id="app">
    <header>
      <a href="/" class="back-btn" title="Вернуться в меню">← Меню</a>
      <div class="header-title">
        <h1>📝 Заполни пропуски</h1>
        <p class="subtitle">Скороговорка «Лигурия»</p>
      </div>
      <div class="stats">
        <span id="score-correct">✓ 0</span>
        <span id="score-wrong">✗ 0</span>
      </div>
    </header>

    <div class="level-bar">
      <span id="level-label">Фрагмент 1 / 5</span>
      <div class="level-track">
        <div class="level-fill" id="level-fill"></div>
      </div>
    </div>

    <main class="board">
      <p class="hint">Выберите слово внизу, затем нажмите на пропуск — или наоборот.</p>
      <div id="sentence" class="sentence" aria-live="polite"></div>
      <div id="feedback" class="feedback hidden"></div>
      <div class="actions">
        <button id="check-btn" class="action-btn action-btn--primary" disabled>Проверить</button>
        <button id="clear-btn" class="action-btn action-btn--ghost">Очистить</button>
        <button id="next-btn" class="action-btn hidden">Далее</button>
      </div>
    </main>

    <section class="bank-section">
      <h2 class="bank-title">Слова</h2>
      <div id="word-bank" class="word-bank"></div>
    </section>
  </div>

  <script type="module" src="/src/games/fill-blanks/main.ts"></script>
</body>
</html>

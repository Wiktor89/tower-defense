<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заполни пропуски</title>
</head>
<body>
  <div id="app">
    <header>
      <a href="/" class="back-btn" title="Вернуться в меню">← Меню</a>
      <div class="header-title">
        <h1>📝 Заполни пропуски</h1>
        <p class="subtitle">Перетащите слова в пропуски</p>
      </div>
      <div class="stats">
        <span id="score-correct">✓ 0</span>
        <span id="score-wrong">✗ 0</span>
      </div>
    </header>

    <main class="board">
      <p class="hint">Перетащите слово справа в пропуск. Когда все пропуски заполнены — нажмите «Проверить».</p>
      <div class="play-area">
        <div class="play-area__text">
          <div id="sentence" class="sentence" aria-live="polite"></div>
        </div>
        <aside class="bank-section">
          <h2 class="bank-title">Слова</h2>
          <div id="word-bank" class="word-bank"></div>
        </aside>
      </div>
      <div id="feedback" class="feedback hidden"></div>
      <div class="actions">
        <button id="check-btn" class="action-btn action-btn--primary hidden">Проверить</button>
        <button id="clear-btn" class="action-btn action-btn--ghost">Очистить</button>
        <button id="next-btn" class="action-btn hidden">Ещё текст</button>
      </div>
    </main>
  </div>

  <script type="module" src="/src/games/fill-blanks/main.ts"></script>
</body>
</html>

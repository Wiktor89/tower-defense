<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Defense — Защита от зомби</title>
</head>
<body>
  <div id="app">
    <header>
      <a href="/" class="back-btn" title="Вернуться в меню">← Меню</a>
      <h1>🌻 Защита от зомби</h1>
      <div class="header-right">
        <div class="stats">
          <span id="sun-display">☀️ 50</span>
          <span id="wave-display">Волна: 1</span>
          <span id="lives-display">❤️ 5</span>
        </div>
        <button id="pause-btn" title="Пауза (Пробел)">⏸ Пауза</button>
      </div>
    </header>

    <div id="plant-bar">
      <button class="plant-btn" data-plant="sunflower" title="Подсолнух — 50☀️">
        <span class="icon">🌻</span>
        <span class="cost">50</span>
      </button>
      <button class="plant-btn" data-plant="peashooter" title="Горохострел — 100☀️">
        <span class="icon">🌱</span>
        <span class="cost">100</span>
      </button>
      <button class="plant-btn" data-plant="wallnut" title="Орех — 50☀️">
        <span class="icon">🥜</span>
        <span class="cost">50</span>
      </button>
      <button class="plant-btn" data-plant="cherrybomb" title="Вишневая бомба — 150☀️">
        <span class="icon">🍒</span>
        <span class="cost">150</span>
      </button>
    </div>

    <canvas id="game-canvas" width="900" height="500"></canvas>

    <div id="overlay" class="hidden">
      <div id="overlay-content">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <button id="overlay-btn">Играть снова</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/games/tower-defense/main.ts"></script>
</body>
</html>
